<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #111;
    font-family: sans-serif;
  }

  #controls {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 10;
    display: flex;
    gap: 6px;
    padding: 8px;
    background: rgba(0,0,0,0.7);
    box-sizing: border-box;
  }

  #urlInput {
    flex: 1;
    padding: 6px 10px;
    font-size: 14px;
    border-radius: 4px;
    border: none;
  }

  #goBtn {
    padding: 6px 14px;
    font-size: 14px;
    border-radius: 4px;
    border: none;
    background: #4a90e2;
    color: white;
    cursor: pointer;
  }

  #frameWrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 200%;
    border: none;
    transform: scale(0.5);
    transform-origin: bottom left;
  }
</style>
</head>
<body>

<div id="controls">
  <input id="urlInput" type="text" placeholder="Enter URL (e.g. https://example.com)" />
  <button id="goBtn">Go</button>
</div>

<div id="frameWrap">
  <iframe id="targetFrame" src="about:blank"></iframe>
</div>

<script>
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('goBtn');
  const frame = document.getElementById('targetFrame');

  function normalizeUrl(url) {
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    return url;
  }

  function loadUrl() {
    const url = input.value;
    if (!url) return;
    frame.src = normalizeUrl(url);
  }

  btn.addEventListener('click', loadUrl);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadUrl();
  });
</script>

</body>
</html>
